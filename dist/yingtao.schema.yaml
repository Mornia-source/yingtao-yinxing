# Rime schema
# encoding: utf-8

schema:
  schema_id: yingtao
  name: 樱桃音形
  version: "5.1"
  author:
    - 樱桃
  description: |
    樱桃音形：小鹤双拼 + 98五笔首二字根形码
    单字 = 小鹤双拼(2位) + 五笔98首根+第二根(2位，不含末笔识别码)；
           另附一条纯双拼(2位)简码；26个单键有硬性首选字
    词组全码 = 纯拼音接龙(4位)，二字词=前字双拼+后字双拼；三字词=前两字
    首码+第三字前两位；四字词=四字首码；五字及以上=前三字首码+末字首码
    二字词简码 = 前字前两位+后字首位(3位)；三字词简码 = 三字首码(3位)
    长句可不间断连续输入，词与词之间的切分交给 enable_sentence 整句
    上下文打分去挑；同音异调词的字面撞车(如"梅花"/"美化")靠主动打；
    再接末字形码消歧(；声明扩展码)，不声明不受影响。
    候选排序：绝对字数少优先，同字数内按权重排。
    临时反查：z 引导全拼，/ 引导98五笔。
  dependencies:
    - py
    - wubi98

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 0
    states: [ 漢字, 汉字 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator@pinyin_lookup
    - reverse_lookup_translator@wubi_lookup
    - table_translator
  filters:
    # 引用格式必须是 *文件名*函数名——这个 librime 构建要求 lua 模块
    # 返回 {函数名 = 函数} 的表，写成 lua_filter@char_priority 会报
    # "func type: nil"，整条候选链会崩掉、完全打不出字。
    - lua_filter@*char_priority*Char_priority_filter
    # 必须放在 char_priority 之后：先让字数/权重排序定下来，emoji
    # 过滤器再往候选2的位置插，不然插进去的位置会被后面的排序打乱。
    - lua_filter@*yingtao_emoji*Yingtao_emoji_filter
    - uniquifier

speller:
  delimiter: " '"
  # ； 只放进 alphabet、不放进 initials：composing 状态下（已经打了
  # 别的字母）按 ； 会被当成编码的一部分继续输入(；形码声明键，见下)；
  # 完全空闲时按 ； 不算合法的起始字符，会落到 punctuator 直接出标点，
  # 不需要另外写 lua_processor 去区分这两种状态。
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  # 最长编码是词组的；声明扩展码：全码(4位)+；(1位)+首字形码(2位) = 7位。
  max_code_length: 7
  auto_select: true
  # AutoSelectAtMaxCodeLength：三种码长满了都自动确认当前排第一的候选——
  # 普通4位全码；单字的；声明码(双拼2位+；+形码2位，共5位)；
  # 词组的；声明扩展码(全码4位+；+首字形码2位，共7位)。
  auto_select_pattern: "^[a-z]{4}$|^[a-z]{2};[a-z]{2}$|^[a-z]{4};[a-z]{2}$"

menu:
  page_size: 6

translator:
  dictionary: yingtao
  enable_charset_filter: false
  enable_sentence: true
  enable_encoder: false
  enable_completion: true
  max_phrase_length: 8
  # 补全候选的注释默认长这样：~剩余编码。这里把开头的 ~ 去掉，
  # 只留下提示码本身。
  comment_format:
    - "xform/^~//"
  # 编码里的 ； 只是内部用来分隔"双拼/全码部分"和"形码声明部分"的
  # 标记字符，显示给用户看的时候换成全角冒号，跟真正的中文分号区分开。
  preedit_format:
    - "xform/;/：/"

# 拼音反查放回 z（实测 table_translator 和 reverse_lookup_translator
# 会同时给出候选，z开头的正常编码不会被吞掉，配合权重分档该赢的还是赢，
# 不是理论上担心的那种冲突）。五笔反查因为没有先例验证，仍用非字母的 /。
pinyin_lookup:
  tag: pinyin_lookup
  dictionary: py
  prefix: "z"
  suffix: "'"
  tips: 〔全拼〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/

wubi_lookup:
  tag: wubi_lookup
  dictionary: wubi98
  prefix: "/"
  tips: 〔五笔98〕

# 标点直接写死在方案里，不 import_preset——避免和同一份 Rime 用户目录下
# 别的方案（wubi98_ci 等）共用 punctuation.yaml 时互相干扰。
# 中文模式（half_shape）下符号键一律出中文标点；西文模式走 ascii_style。
punctuator:
  half_shape:
    '!' : { commit: ！ }
    '@' : '@'
    '#' : '#'
    '$' : [ ￥, '$', '€', '£', '¢' ]
    '%' : [ '%', ％, '°', '‰', '℃' ]
    '^' : { commit: …… }
    '&' : '&'
    '*' : [ '*', ×, ·, ※ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
    '\' : [ 、, '\', ＼ ]
    '|' : [ '|', ·, ｜, '§' ]
    ':' : { commit: ： }
    ';' : { commit: ； }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '?' : { commit: ？ }
    '/' : [ 、, '/', ／, ÷ ]
    '`' : '·'
    '~' : [ '~', ～ ]
  full_shape:
    ' ' : { commit: '　' }
    '!' : { commit: ！ }
    '@' : ＠
    '#' : ＃
    '$' : [ ￥, '€', '£', '¢' ]
    '%' : [ ％, '°', '‰', '℃' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ×, ·, ※ ]
    '(' : （
    ')' : ）
    '-' : －
    '_' : ——
    '+' : ＋
    '=' : ＝
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
    '\' : [ 、, ＼ ]
    '|' : [ ｜, ·, '§' ]
    ':' : { commit: ： }
    ';' : { commit: ； }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '?' : { commit: ？ }
    '/' : [ ／, ÷ ]
    '`' : ｀
    '~' : ～
  ascii_style:
    '!' : { commit: '!' }
    '@' : '@'
    '#' : '#'
    '$' : '$'
    '%' : '%'
    '^' : { commit: '^' }
    '&' : '&'
    '*' : '*'
    '(' : '('
    ')' : ')'
    '-' : '-'
    '_' : '_'
    '+' : '+'
    '=' : '='
    '[' : '['
    ']' : ']'
    '{' : '{'
    '}' : '}'
    '\' : '\'
    '|' : '|'
    ':' : { commit: ':' }
    ';' : { commit: ';' }
    '''' : "'"
    '"' : '"'
    '<' : '<'
    '>' : '>'
    ',' : { commit: ',' }
    '.' : { commit: '.' }
    '?' : { commit: '?' }
    '/' : '/'
    '`' : '`'
    '~' : '~'

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    pinyin_lookup: "^z[a-z]*'?$"
    wubi_lookup: "^/[a-z]+$"
