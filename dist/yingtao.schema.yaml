# Rime schema
# encoding: utf-8

schema:
  schema_id: yingtao
  name: 樱桃音形
  version: "3.0"
  author:
    - 樱桃
  description: |
    樱桃音形：自然码双拼 + 98五笔首末字根形码
    单字 = 自然码双拼(2位) + 五笔98首根+末根(2位，不含末笔识别码)；
           另附一条纯双拼(2位)简码；26个单键有硬性首选字
    二字词 = 简码 前字前两位+后字首位(3位)；全码 前字前两位+后字前两位(4位)
    三字词 = 简码 三字首码(3位)；全码 前两字首码+第三字前两位(4位)
    四字词 = 四字首码(4位)
    五字及以上 = 前三字首码 + 末字首码(4位)
    以上各词长在 4 位全码之后都可再打 2 位形码(最后两个字的首字根)精确定位。
    候选排序：字数少的优先，全码精确匹配的候选例外，同字数内按权重排。
    临时反查：z 引导全拼，/ 引导98五笔。
  dependencies:
    - py
    - wubi98

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 0
    states: [ 漢字, 汉字 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    # 必须在 punctuator 之前，才能在完全空闲(没有composing)时拦截到
    # 单独按下的分号——否则 punctuator 会先把它当标点直接提交掉。
    # 注意：lua_processor 用全局变量名引用(rime.lua里的
    # semicolon_delete_processor)，不是 *文件名*函数名 那种写法——那种
    # 写法只对 lua_filter 有效，对 lua_processor 无效(实测每次按键都报
    # func type: nil / attempt to call a nil value)。这个全局变量需要
    # 自己在用户目录的 rime.lua 里手动加一行，见 README 安装说明。
    - lua_processor@semicolon_delete_processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator@pinyin_lookup
    - reverse_lookup_translator@wubi_lookup
    - table_translator
  filters:
    # 引用格式必须是 *文件名*函数名——这个 librime 构建要求 lua 模块
    # 返回 {函数名 = 函数} 的表，写成 lua_filter@char_priority 会报
    # "func type: nil"，整条候选链会崩掉、完全打不出字。
    - lua_filter@*char_priority*Char_priority_filter
    # 双字词同时有 4 码和 6 码词条，打 4 码时它自己的 6 码会作为补全候选
    # 再冒出来一次，这里去重。放在排序之后，保证留下的是权重高的那条。
    - uniquifier

speller:
  delimiter: " '"
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  # 抬到 6 是为了让双字词的 6 码精确码打得出来。librime 里
  # AutoSelectAtMaxCodeLength 会在候选码长达到 max_code_length 时直接确认
  # 当前选中项（不管有几个候选），如果这里还是 4，第 5、6 码根本没机会输入。
  max_code_length: 6
  auto_select: true
  # AutoSelectUniqueCandidate 要求「候选恰好只有 1 个」才自动上屏，
  # 所以这条规则的实际效果是：4 码唯一 → 直接上屏（本来也不需要 6 码）；
  # 4 码撞车 → 不上屏，可以继续打 2 位形码精确定位；6 码唯一 → 上屏。
  auto_select_pattern: "^[a-z]{4}$|^[a-z]{6}$"

menu:
  page_size: 6

translator:
  dictionary: yingtao
  enable_charset_filter: false
  enable_sentence: true
  enable_encoder: false
  enable_completion: true
  max_phrase_length: 8
  # 补全候选的注释默认长这样：~剩余编码。这里把开头的 ~ 去掉，
  # 只留下提示码本身。
  comment_format:
    - "xform/^~//"

# 拼音反查放回 z（实测 table_translator 和 reverse_lookup_translator
# 会同时给出候选，z开头的正常编码不会被吞掉，配合权重分档该赢的还是赢，
# 不是理论上担心的那种冲突）。五笔反查因为没有先例验证，仍用非字母的 /。
pinyin_lookup:
  tag: pinyin_lookup
  dictionary: py
  prefix: "z"
  suffix: "'"
  tips: 〔全拼〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/

wubi_lookup:
  tag: wubi_lookup
  dictionary: wubi98
  prefix: "/"
  tips: 〔五笔98〕

# 标点直接写死在方案里，不 import_preset——避免和同一份 Rime 用户目录下
# 别的方案（wubi98_ci 等）共用 punctuation.yaml 时互相干扰。
# 中文模式（half_shape）下符号键一律出中文标点；西文模式走 ascii_style。
punctuator:
  half_shape:
    '!' : { commit: ！ }
    '@' : '@'
    '#' : '#'
    '$' : [ ￥, '$', '€', '£', '¢' ]
    '%' : [ '%', ％, '°', '‰', '℃' ]
    '^' : { commit: …… }
    '&' : '&'
    '*' : [ '*', ×, ·, ※ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
    '\' : [ 、, '\', ＼ ]
    '|' : [ '|', ·, ｜, '§' ]
    ':' : { commit: ： }
    ';' : { commit: ； }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '?' : { commit: ？ }
    '/' : [ 、, '/', ／, ÷ ]
    '`' : '·'
    '~' : [ '~', ～ ]
  full_shape:
    ' ' : { commit: '　' }
    '!' : { commit: ！ }
    '@' : ＠
    '#' : ＃
    '$' : [ ￥, '€', '£', '¢' ]
    '%' : [ ％, '°', '‰', '℃' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ×, ·, ※ ]
    '(' : （
    ')' : ）
    '-' : －
    '_' : ——
    '+' : ＋
    '=' : ＝
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
    '\' : [ 、, ＼ ]
    '|' : [ ｜, ·, '§' ]
    ':' : { commit: ： }
    ';' : { commit: ； }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '?' : { commit: ？ }
    '/' : [ ／, ÷ ]
    '`' : ｀
    '~' : ～
  ascii_style:
    '!' : { commit: '!' }
    '@' : '@'
    '#' : '#'
    '$' : '$'
    '%' : '%'
    '^' : { commit: '^' }
    '&' : '&'
    '*' : '*'
    '(' : '('
    ')' : ')'
    '-' : '-'
    '_' : '_'
    '+' : '+'
    '=' : '='
    '[' : '['
    ']' : ']'
    '{' : '{'
    '}' : '}'
    '\' : '\'
    '|' : '|'
    ':' : { commit: ':' }
    ';' : { commit: ';' }
    '''' : "'"
    '"' : '"'
    '<' : '<'
    '>' : '>'
    ',' : { commit: ',' }
    '.' : { commit: '.' }
    '?' : { commit: '?' }
    '/' : '/'
    '`' : '`'
    '~' : '~'

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    pinyin_lookup: "^z[a-z]*'?$"
    wubi_lookup: "^/[a-z]+$"
