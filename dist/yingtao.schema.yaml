# Rime schema
# encoding: utf-8

schema:
  schema_id: yingtao
  name: 樱桃音形
  version: "5.0"
  author:
    - 樱桃
  description: |
    樱桃音形：小鹤双拼 + 98五笔首二字根形码
    单字 = 小鹤双拼(2位) + 五笔98首根+第二根(2位，不含末笔识别码)；
           另附一条纯双拼(2位)简码；26个单键有硬性首选字
    词组全码(所有词长统一) = 首字双拼(2位) + 末字形码(2位)，固定4位
    二字词简码 = 前字前两位+后字首位(3位)；三字词简码 = 三字首码(3位)
    长句可不间断连续输入，词与词之间的切分交给 enable_sentence 整句
    上下文打分去挑；同音异调词的字面撞车(如"梅花"/"美化")靠全码自带
    的末字形码天然分开，不要求逐词手动定位到唯一候选。
    候选排序：绝对字数少优先，同字数内按权重排。
    临时反查：z 引导全拼，/ 引导98五笔。
  dependencies:
    - py
    - wubi98

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 0
    states: [ 漢字, 汉字 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator@pinyin_lookup
    - reverse_lookup_translator@wubi_lookup
    - table_translator
  filters:
    # 引用格式必须是 *文件名*函数名——这个 librime 构建要求 lua 模块
    # 返回 {函数名 = 函数} 的表，写成 lua_filter@char_priority 会报
    # "func type: nil"，整条候选链会崩掉、完全打不出字。
    - lua_filter@*char_priority*Char_priority_filter
    - uniquifier

speller:
  delimiter: " '"
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  # 6 码形码扩展码已取消，最长编码回落到 4 位（单字全码/词组全码）。
  max_code_length: 4
  auto_select: true
  # AutoSelectAtMaxCodeLength：某一段编码打满 4 位后自动确认当前排在
  # 第一位的候选，不再要求手动选字/打形码精确定位——重码交给整句
  # 连续输入时 enable_sentence 的上下文打分去挑。
  auto_select_pattern: "^[a-z]{4}$"

menu:
  page_size: 6

translator:
  dictionary: yingtao
  enable_charset_filter: false
  enable_sentence: true
  enable_encoder: false
  enable_completion: true
  max_phrase_length: 8
  # 补全候选的注释默认长这样：~剩余编码。这里把开头的 ~ 去掉，
  # 只留下提示码本身。
  comment_format:
    - "xform/^~//"

# 拼音反查放回 z（实测 table_translator 和 reverse_lookup_translator
# 会同时给出候选，z开头的正常编码不会被吞掉，配合权重分档该赢的还是赢，
# 不是理论上担心的那种冲突）。五笔反查因为没有先例验证，仍用非字母的 /。
pinyin_lookup:
  tag: pinyin_lookup
  dictionary: py
  prefix: "z"
  suffix: "'"
  tips: 〔全拼〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/

wubi_lookup:
  tag: wubi_lookup
  dictionary: wubi98
  prefix: "/"
  tips: 〔五笔98〕

# 标点直接写死在方案里，不 import_preset——避免和同一份 Rime 用户目录下
# 别的方案（wubi98_ci 等）共用 punctuation.yaml 时互相干扰。
# 中文模式（half_shape）下符号键一律出中文标点；西文模式走 ascii_style。
punctuator:
  half_shape:
    '!' : { commit: ！ }
    '@' : '@'
    '#' : '#'
    '$' : [ ￥, '$', '€', '£', '¢' ]
    '%' : [ '%', ％, '°', '‰', '℃' ]
    '^' : { commit: …… }
    '&' : '&'
    '*' : [ '*', ×, ·, ※ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
    '\' : [ 、, '\', ＼ ]
    '|' : [ '|', ·, ｜, '§' ]
    ':' : { commit: ： }
    ';' : { commit: ； }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '?' : { commit: ？ }
    '/' : [ 、, '/', ／, ÷ ]
    '`' : '·'
    '~' : [ '~', ～ ]
  full_shape:
    ' ' : { commit: '　' }
    '!' : { commit: ！ }
    '@' : ＠
    '#' : ＃
    '$' : [ ￥, '€', '£', '¢' ]
    '%' : [ ％, '°', '‰', '℃' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ×, ·, ※ ]
    '(' : （
    ')' : ）
    '-' : －
    '_' : ——
    '+' : ＋
    '=' : ＝
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
    '\' : [ 、, ＼ ]
    '|' : [ ｜, ·, '§' ]
    ':' : { commit: ： }
    ';' : { commit: ； }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '?' : { commit: ？ }
    '/' : [ ／, ÷ ]
    '`' : ｀
    '~' : ～
  ascii_style:
    '!' : { commit: '!' }
    '@' : '@'
    '#' : '#'
    '$' : '$'
    '%' : '%'
    '^' : { commit: '^' }
    '&' : '&'
    '*' : '*'
    '(' : '('
    ')' : ')'
    '-' : '-'
    '_' : '_'
    '+' : '+'
    '=' : '='
    '[' : '['
    ']' : ']'
    '{' : '{'
    '}' : '}'
    '\' : '\'
    '|' : '|'
    ':' : { commit: ':' }
    ';' : { commit: ';' }
    '''' : "'"
    '"' : '"'
    '<' : '<'
    '>' : '>'
    ',' : { commit: ',' }
    '.' : { commit: '.' }
    '?' : { commit: '?' }
    '/' : '/'
    '`' : '`'
    '~' : '~'

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    pinyin_lookup: "^z[a-z]*'?$"
    wubi_lookup: "^/[a-z]+$"
